name: vcpkg package compatibility

on:
  pull_request:
    paths:
      - "vcpkg/**"
      - ".github/workflows/vcpkg.yml"
  push:
    branches: [main]
    paths:
      - "vcpkg/**"
      - ".github/workflows/vcpkg.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ilic vcpkg (${{ matrix.triplet }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triplet: x64-linux
          - os: macos-14
            triplet: arm64-osx
          - os: windows-latest
            triplet: x64-windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      VCPKG_ROOT: ${{ github.workspace }}/build/vcpkg
      VCPKG_TRIPLET: ${{ matrix.triplet }}
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg/archives
      VCPKG_DOWNLOADS: ${{ github.workspace }}/.cache/vcpkg/downloads
      VCPKG_DISABLE_METRICS: "1"

    steps:
      - name: Check out ilic
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check out pinned vcpkg
        uses: actions/checkout@v6
        with:
          repository: microsoft/vcpkg
          ref: 2026.05.25
          path: build/vcpkg
          persist-credentials: false

      - name: Restore vcpkg caches
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
            ${{ env.VCPKG_DOWNLOADS }}
          key: vcpkg-v1-2026.05.25-${{ matrix.triplet }}-${{ hashFiles('vcpkg/ports/ilic/**') }}
          restore-keys: |
            vcpkg-v1-2026.05.25-${{ matrix.triplet }}-

      - name: Set up MSVC developer command prompt
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Bootstrap vcpkg (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics'

      - name: Install ilic through overlay (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: >-
          "$VCPKG_ROOT/vcpkg" install "ilic:${VCPKG_TRIPLET}"
          --overlay-ports="$GITHUB_WORKSPACE/vcpkg/ports"

      - name: Install ilic through overlay (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          & "$env:VCPKG_ROOT\vcpkg.exe" install "ilic:$env:VCPKG_TRIPLET"
          "--overlay-ports=$env:GITHUB_WORKSPACE\vcpkg\ports"

      - name: Configure consumer
        run: >-
          cmake
          -S test/consumer/installed-package
          -B build/vcpkg-consumer
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}

      - name: Build consumer
        run: cmake --build build/vcpkg-consumer --parallel

      - name: Run consumer smoke tests
        run: ctest --test-dir build/vcpkg-consumer --output-on-failure
