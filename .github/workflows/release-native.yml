name: Release native compiler

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate release contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Validate stable tag and all version sources
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node scripts/check-release-version.mjs \
            --expected-version "${GITHUB_REF_NAME#v}" \
            --expected-tag "$GITHUB_REF_NAME"
          node --test test/release/CheckReleaseVersionTest.mjs

  build-macos-arm64:
    needs: validate-release
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: macos-14
    timeout-minutes: 50
    env:
      SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache
      SCCACHE_CACHE_SIZE: "2G"
      SCCACHE_BASEDIRS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
          persist-credentials: false
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.17.0"
      - name: Restore release sccache cache
        uses: actions/cache@v5
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-v2-release-cli-macos-arm64-${{ env.SOURCE_SHA }}
          restore-keys: |
            sccache-v1-${{ runner.os }}-${{ runner.arch }}-OFF-${{ env.SOURCE_SHA }}
            sccache-v2-release-cli-macos-arm64-
      - name: Verify ARM64 runner
        run: test "$(uname -m)" = "arm64"
      - name: Configure release binary
        run: >-
          cmake -S . -B build/release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DBUILD_TESTING=OFF
          -DILIC_BUILD_TESTS=OFF
          -DILIC_BUILD_CLI=ON
          -DILIC_STATIC_DISTRIBUTION=ON
      - name: Build release binary
        run: cmake --build build/release --target ilic --parallel
      - name: Show release sccache statistics
        if: always()
        run: sccache --show-stats
      - name: Verify and smoke-test binary
        run: |
          scripts/check-macos-runtime-deps.sh build/release/ilic
          build/release/ilic -version | tee ilic-version.txt
          expected_version=$(sed -nE 's/.*project\(ilic VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)
          qualifier=$(sed -nE 's/.*set\(ILIC_VERSION_QUALIFIER "([^"]*)".*/\1/p' CMakeLists.txt)
          if [ -n "$qualifier" ]; then expected_version="$expected_version-$qualifier"; fi
          grep -q "^ilic ${expected_version} " ilic-version.txt
          build/release/ilic -silent docs/examples/models/Legacy.ili
          build/release/ilic -silent -repositories test/repository/fixture --no-default-repositories -models RepositoryRoot --ili-version 2.3
          build/release/ilic -silent -repositories test/repository/fixture --no-default-repositories test/repository/import-fallback/RepositoryConsumer.ili
      - name: Package
        run: tar -czf ilic-macos-arm64.tar.gz -C build/release ilic
      - uses: actions/upload-artifact@v6
        with:
          name: ilic-macos-arm64
          path: ilic-macos-arm64.tar.gz
          if-no-files-found: error

  build-linux-x86_64:
    needs: validate-release
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache-musl
      SCCACHE_CACHE_SIZE: "2G"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
          persist-credentials: false
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.17.0"
      - name: Restore musl release sccache cache
        uses: actions/cache@v5
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-v2-release-musl-linux-x64-${{ env.SOURCE_SHA }}
          restore-keys: |
            sccache-v2-release-musl-linux-x64-
      - name: Build and verify in pinned musl image
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          mkdir -p "$SCCACHE_DIR"
          docker run --rm \
            -v "$PWD:/src" \
            -v "$SCCACHE_DIR:/sccache-cache" \
            -v "$SCCACHE_PATH:/usr/local/bin/sccache:ro" \
            -e SCCACHE_DIR=/sccache-cache \
            -e SCCACHE_CACHE_SIZE=2G \
            -e SCCACHE_BASEDIRS=/src \
            -w /src \
            alpine:3.20.3 sh -euxc '
              apk add --no-cache build-base cmake ninja perl python3 linux-headers openssl-dev openssl-libs-static file binutils
              cmake -S . -B build/release-linux -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_COMPILER_LAUNCHER=sccache \
                -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
                -DBUILD_TESTING=OFF \
                -DILIC_BUILD_TESTS=OFF \
                -DILIC_BUILD_CLI=ON \
                -DILIC_STATIC_DISTRIBUTION=ON
              cmake --build build/release-linux --target ilic --parallel
              sccache --show-stats
              scripts/check-linux-static.sh build/release-linux/ilic
              build/release-linux/ilic -version | tee ilic-version.txt
              expected_version=$(sed -nE "s/.*project\\(ilic VERSION ([0-9]+\\.[0-9]+\\.[0-9]+).*/\\1/p" CMakeLists.txt)
              qualifier=$(sed -nE "s/.*set\\(ILIC_VERSION_QUALIFIER \"([^\"]*)\".*/\\1/p" CMakeLists.txt)
              if [ -n "$qualifier" ]; then expected_version="$expected_version-$qualifier"; fi
              grep -q "^ilic ${expected_version} " ilic-version.txt
              build/release-linux/ilic -silent docs/examples/models/Legacy.ili
              build/release-linux/ilic -silent -repositories test/repository/fixture --no-default-repositories -models RepositoryRoot --ili-version 2.3
              build/release-linux/ilic -silent -repositories test/repository/fixture --no-default-repositories test/repository/import-fallback/RepositoryConsumer.ili
              tar -czf ilic-linux-x86_64.tar.gz -C build/release-linux ilic
            '
      - name: Normalize musl sccache ownership
        if: always()
        shell: bash
        run: sudo chown -R "$(id -u):$(id -g)" "$SCCACHE_DIR"
      - uses: actions/upload-artifact@v6
        with:
          name: ilic-linux-x86_64
          path: ilic-linux-x86_64.tar.gz
          if-no-files-found: error

  build-windows-x86_64:
    needs: validate-release
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    timeout-minutes: 55
    env:
      SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache
      SCCACHE_CACHE_SIZE: "2G"
      SCCACHE_BASEDIRS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
          persist-credentials: false
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.17.0"
      - name: Restore release sccache cache
        uses: actions/cache@v5
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-v2-release-cli-windows-x64-${{ env.SOURCE_SHA }}
          restore-keys: |
            sccache-v1-${{ runner.os }}-${{ runner.arch }}-ON-${{ env.SOURCE_SHA }}
            sccache-v2-release-cli-windows-x64-
      - name: Set up MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Verify x86_64 runner
        shell: pwsh
        run: |
          if ([Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne "X64") {
            throw "x86_64 Windows is required"
          }
      - name: Configure release binary
        run: >-
          cmake -S . -B build/release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DBUILD_TESTING=OFF
          -DILIC_BUILD_TESTS=OFF
          -DILIC_BUILD_CLI=ON
          -DILIC_STATIC_DISTRIBUTION=ON
      - name: Build release binary
        run: cmake --build build/release --target ilic --parallel
      - name: Show release sccache statistics
        if: always()
        run: sccache --show-stats
      - name: Verify and smoke-test binary
        shell: pwsh
        run: |
          ./scripts/check-windows-runtime-deps.ps1 -Binary build/release/ilic.exe
          $versionOutput = build/release/ilic.exe -version
          $versionOutput
          $cmakeVersion = Select-String -Path CMakeLists.txt -Pattern 'project\(ilic VERSION ([0-9]+\.[0-9]+\.[0-9]+)' | ForEach-Object { $_.Matches[0].Groups[1].Value }
          $cmakeQualifier = Select-String -Path CMakeLists.txt -Pattern 'set\(ILIC_VERSION_QUALIFIER "([^"]*)"' | ForEach-Object { $_.Matches[0].Groups[1].Value }
          $expectedVersion = $cmakeVersion
          if (-not [string]::IsNullOrEmpty($cmakeQualifier)) {
            $expectedVersion = "$cmakeVersion-$cmakeQualifier"
          }
          if ($versionOutput[0] -notmatch "^ilic $expectedVersion ") {
            throw "ilic.exe did not report version $expectedVersion"
          }
          build/release/ilic.exe -silent docs/examples/models/Legacy.ili
          build/release/ilic.exe -silent -repositories test/repository/fixture --no-default-repositories -models RepositoryRoot --ili-version 2.3
          build/release/ilic.exe -silent -repositories test/repository/fixture --no-default-repositories test/repository/import-fallback/RepositoryConsumer.ili
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path build/release/ilic.exe -DestinationPath ilic-windows-x86_64.zip
      - uses: actions/upload-artifact@v6
        with:
          name: ilic-windows-x86_64
          path: ilic-windows-x86_64.zip
          if-no-files-found: error

  build-native-sdk:
    name: Build native SDK (${{ matrix.name }})
    needs: validate-release
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            archive: ilic-sdk-linux-x86_64.tar.gz
            exe_suffix: ""
          - name: macOS ARM64
            os: macos-14
            archive: ilic-sdk-macos-arm64.tar.gz
            exe_suffix: ""
          - name: Windows x86_64
            os: windows-latest
            archive: ilic-sdk-windows-x86_64.zip
            exe_suffix: ".exe"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache
      SCCACHE_CACHE_SIZE: "2G"
      SCCACHE_BASEDIRS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
          persist-credentials: false
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.17.0"
      - name: Restore native SDK sccache cache
        uses: actions/cache@v5
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-v1-package-${{ runner.os }}-${{ runner.arch }}-${{ env.SOURCE_SHA }}
          restore-keys: |
            sccache-v1-package-${{ runner.os }}-${{ runner.arch }}-
      - name: Set up MSVC developer command prompt
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Verify Linux architecture
        if: runner.os == 'Linux'
        run: test "$(uname -m)" = "x86_64"
      - name: Verify macOS architecture
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = "arm64"
      - name: Verify Windows architecture
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ([Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne "X64") {
            throw "x86_64 Windows is required"
          }
      - name: Install Linux build dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes ninja-build
      - name: Configure native SDK
        run: >-
          cmake -S . -B build/sdk -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          -DCMAKE_INSTALL_LIBDIR=lib
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DBUILD_TESTING=OFF
          -DILIC_BUILD_TESTS=OFF
          -DILIC_BUILD_CLI=OFF
          -DILIC_ENABLE_NATIVE_REPOSITORY=OFF
          -DILIC_STATIC_DISTRIBUTION=OFF
          -DILIC_ENABLE_INSTALL=ON
      - name: Build native SDK
        run: cmake --build build/sdk --parallel
      - name: Show native SDK sccache statistics
        if: always()
        run: sccache --show-stats
      - name: Verify installed SDK in clean consumers
        run: >-
          cmake
          -DILIC_BUILD_DIR=${{ github.workspace }}/build/sdk
          -DILIC_CONSUMER_SOURCE_DIR=${{ github.workspace }}/test/consumer/installed-package
          -DILIC_TEST_ROOT=${{ github.workspace }}/build/sdk-smoke
          -DILIC_SOURCE_DIR=${{ github.workspace }}
          -DILIC_CONSUMER_EXE_SUFFIX=${{ matrix.exe_suffix }}
          -DILIC_GENERATOR=Ninja
          -DILIC_GENERATOR_PLATFORM=
          -DILIC_GENERATOR_TOOLSET=
          -DILIC_BUILD_CONFIG=Release
          -P cmake/run_installed_package_test.cmake
      - name: Install native SDK
        run: cmake --install build/sdk --prefix build/sdk-prefix --config Release
      - name: Package native SDK (Unix)
        if: runner.os != 'Windows'
        env:
          SDK_ARCHIVE: ${{ matrix.archive }}
        run: tar -czf "$SDK_ARCHIVE" -C build/sdk-prefix .
      - name: Package native SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SDK_ARCHIVE: ${{ matrix.archive }}
        run: Compress-Archive -Path build/sdk-prefix/* -DestinationPath $env:SDK_ARCHIVE
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  build-npm-release:
    name: Build and verify stable npm artifacts
    needs: validate-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Build pinned WASM compiler
        run: ./scripts/build-wasm.sh
      - name: Test source packages and release staging
        run: |
          npm install --prefix packages/tools --no-save --package-lock=false ./packages/repository-core
          npm install --prefix packages/compiler-wasm --no-save --package-lock=false ./packages/repository-core ./packages/tools
          npm test --prefix packages/repository-core
          npm test --prefix packages/tools
          npm test --prefix packages/compiler-wasm
          node --test test/npm/PrepareNpmSnapshotTest.mjs test/npm/PrepareNpmReleaseTest.mjs
          node --test test/release/CheckReleaseVersionTest.mjs
      - name: Stage stable packages
        id: stage
        run: |
          node scripts/prepare-npm-release.mjs \
            --expected-version "${GITHUB_REF_NAME#v}" \
            --expected-tag "$GITHUB_REF_NAME" \
            --github-output "$GITHUB_OUTPUT"
      - name: Verify tarballs in an empty consumer
        run: |
          node scripts/test-npm-packages.mjs \
            --staging-root build/npm-release \
            --expected-version "${GITHUB_REF_NAME#v}" \
            --version-kind stable
      - uses: actions/upload-artifact@v6
        with:
          name: ilic-npm-release
          path: |
            build/npm-release/tarballs/*.tgz
            build/npm-release/release-manifest.json
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    needs:
      - build-macos-arm64
      - build-linux-x86_64
      - build-windows-x86_64
      - build-native-sdk
      - build-npm-release
    if: >-
      always() &&
      needs.build-macos-arm64.result == 'success' &&
      needs.build-linux-x86_64.result == 'success' &&
      needs.build-windows-x86_64.result == 'success' &&
      needs.build-native-sdk.result == 'success' &&
      (github.event_name != 'push' || needs.build-npm-release.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: native-release-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Download macOS archive
        uses: actions/download-artifact@v7
        with:
          name: ilic-macos-arm64
          path: dist
      - name: Download Linux archive
        uses: actions/download-artifact@v7
        with:
          name: ilic-linux-x86_64
          path: dist
      - name: Download Windows archive
        uses: actions/download-artifact@v7
        with:
          name: ilic-windows-x86_64
          path: dist
      - name: Download native SDK archives
        uses: actions/download-artifact@v7
        with:
          pattern: ilic-sdk-*
          path: dist
          merge-multiple: true
      - name: Create checksums
        shell: bash
        run: sha256sum dist/ilic-* > dist/SHA256SUMS
      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          api_root="repos/$GITHUB_REPOSITORY"
          release_id=

          if [[ "$GITHUB_EVENT_NAME" != "push" ]]; then
            release_tag=snapshot
            release_title="ilic snapshot"
            release_notes=$(printf 'Moving snapshot built from `%s` ([workflow run](%s/actions/runs/%s)).\n' \
              "$SOURCE_SHA" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")

            if gh api --silent "$api_root/git/ref/tags/$release_tag" >/dev/null 2>&1; then
              gh api --method PATCH "$api_root/git/refs/tags/$release_tag" \
                -f sha="$SOURCE_SHA" -F force=true >/dev/null
            else
              gh api --method POST "$api_root/git/refs" \
                -f ref="refs/tags/$release_tag" -f sha="$SOURCE_SHA" >/dev/null
            fi

            if release_id=$(gh api "$api_root/releases/tags/$release_tag" --jq .id 2>/dev/null); then
              gh api --method PATCH "$api_root/releases/$release_id" \
                -f name="$release_title" \
                -f body="$release_notes" \
                -F draft=false \
                -F prerelease=true \
                -f make_latest=false >/dev/null
            else
              release_id=$(gh api --method POST "$api_root/releases" \
                -f tag_name="$release_tag" \
                -f name="$release_title" \
                -f body="$release_notes" \
                -F draft=false \
                -F prerelease=true \
                -f make_latest=false \
                --jq .id)
            fi
          else
            release_tag="$GITHUB_REF_NAME"
            # Keep this job checkout-free: validate the pushed tag through the API.
            if ! gh api --silent "$api_root/git/ref/tags/$release_tag" >/dev/null 2>&1; then
              echo "The pushed tag $release_tag does not exist on GitHub; refusing to create a release." >&2
              exit 1
            fi
            if release_id=$(gh api "$api_root/releases/tags/$release_tag" --jq .id 2>/dev/null); then
              echo "Reusing immutable GitHub release $release_tag"
            else
              release_id=$(gh api --method POST "$api_root/releases" \
                -f tag_name="$release_tag" \
                -f name="ilic $release_tag" \
                -F draft=false \
                -F prerelease=false \
                -F generate_release_notes=true \
                -f make_latest=true \
                --jq .id)
            fi
          fi

          if [[ "$GITHUB_EVENT_NAME" != "push" ]]; then
            while IFS=$'\t' read -r existing_asset_id existing_asset_name; do
              [[ -n "$existing_asset_id" ]] || continue
              gh api --method DELETE "$api_root/releases/assets/$existing_asset_id" >/dev/null
            done < <(
              gh api --paginate "$api_root/releases/$release_id/assets?per_page=100" \
                --jq '.[] | [.id, .name] | @tsv'
            )
          fi

          for asset_path in dist/*; do
            asset_name=${asset_path##*/}
            existing_asset_id=$(gh api --paginate \
              "$api_root/releases/$release_id/assets?per_page=100" \
              --jq ".[] | select(.name == \"$asset_name\") | .id" | head -n 1)
            if [[ -n "$existing_asset_id" ]]; then
              existing_path="$RUNNER_TEMP/existing-$asset_name"
              gh api "$api_root/releases/assets/$existing_asset_id" \
                -H 'Accept: application/octet-stream' > "$existing_path"
              if cmp -s "$asset_path" "$existing_path"; then
                echo "Verified existing immutable asset: $asset_name"
                continue
              fi
              echo "Existing asset $asset_name differs from the locally built asset" >&2
              exit 1
            fi
            curl --fail --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'Content-Type: application/octet-stream' \
              --data-binary "@$asset_path" \
              "https://uploads.github.com/$api_root/releases/$release_id/assets?name=$asset_name" \
              >/dev/null
          done

  request-npm-release:
    name: Request stable npm publication
    needs:
      - build-npm-release
      - publish-release
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.build-npm-release.result == 'success' &&
      needs.publish-release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Request trusted npm publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg event_type "stable-npm-release-requested" \
            --arg release_tag "$GITHUB_REF_NAME" \
            --arg release_run_id "$GITHUB_RUN_ID" \
            --arg release_sha "$GITHUB_SHA" \
            '{event_type: $event_type, client_payload: {
              release_tag: $release_tag,
              release_run_id: $release_run_id,
              release_sha: $release_sha
            }}' \
            | curl --fail-with-body --silent --show-error \
                -X POST \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/dispatches" \
                --data-binary @-

  request-vcpkg-release:
    name: Request vcpkg publication
    needs: publish-release
    if: ${{ always() && needs.publish-release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Request trusted vcpkg publication
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid release source SHA: $SOURCE_SHA" >&2
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            release_kind=stable
            release_tag="$GITHUB_REF_NAME"
            if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid stable release tag: $release_tag" >&2
              exit 1
            fi
          else
            release_kind=snapshot
            release_tag=snapshot
          fi

          jq -n \
            --arg event_type "vcpkg-release-ready" \
            --arg source_sha "$SOURCE_SHA" \
            --arg release_kind "$release_kind" \
            --arg release_tag "$release_tag" \
            --arg release_run_id "$GITHUB_RUN_ID" \
            '{event_type: $event_type, client_payload: {
              source_sha: $source_sha,
              release_kind: $release_kind,
              release_tag: $release_tag,
              release_run_id: $release_run_id
            }}' \
            | curl --fail-with-body --silent --show-error \
                -X POST \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/dispatches" \
                --data-binary @-
