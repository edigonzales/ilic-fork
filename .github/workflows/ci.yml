name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native Release (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            static: "OFF"
          - name: macOS ARM64
            os: macos-14
            static: "OFF"
          - name: Windows x86_64
            os: windows-latest
            static: "ON"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify Linux architecture
        if: runner.os == 'Linux'
        run: test "$(uname -m)" = "x86_64"
      - name: Verify macOS architecture
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = "arm64"
      - name: Verify Windows architecture
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ([Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne "X64") {
            throw "x86_64 Windows is required"
          }
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libcurl4-openssl-dev ninja-build
      - name: Configure native build (Unix)
        if: runner.os != 'Windows'
        run: cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DILIC_STATIC_DISTRIBUTION=${{ matrix.static }}
      - name: Configure native build (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build/ci -A x64 -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DILIC_STATIC_DISTRIBUTION=${{ matrix.static }}
      - name: Build native compiler and tests
        run: cmake --build build/ci --config Release --parallel
      - name: Run native tests
        run: ctest --test-dir build/ci -C Release --output-on-failure
      - name: Verify Windows runtime dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check-windows-runtime-deps.ps1 -Binary build/ci/Release/ilic.exe
  conformance:
    name: Compiler Conformance (ilic)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out ilic
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Download conformance suite
        shell: bash
        run: |
          set -euo pipefail
          suite_commit=88576ffc4cd491dd72d2375eb897ea9f3f55d2c3
          archive="$RUNNER_TEMP/interlis-conformance-suite.tar.gz"
          curl --fail --location --retry 3 \
            "https://codeberg.org/edigonzales/interlis-compiler-testsuite/archive/${suite_commit}.tar.gz" \
            --output "$archive"
          mkdir -p conformance-suite
          tar --extract --gzip --strip-components=1 --file="$archive" --directory=conformance-suite
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install --yes libcurl4-openssl-dev ninja-build
      - name: Cache conformance fixtures
        uses: actions/cache@v4
        with:
          path: ~/.cache/interlis-conformance
          key: interlis-conformance-fixtures-4ea207f388ef7d91b03d968cc1636f4de84e36ea
      - name: Build ilic for conformance tests
        run: |
          cmake -S . -B build/conformance-ilic -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DILIC_ENABLE_NATIVE_REPOSITORY=OFF \
            -DILIC_STATIC_DISTRIBUTION=OFF \
            -DBUILD_TESTING=OFF
          cmake --build build/conformance-ilic --target ilic --parallel
      - name: Run conformance suite
        id: conformance
        continue-on-error: true
        shell: bash
        run: |
          set +e
          java conformance-suite/InterlisConformance.java run \
            --suite conformance-suite/suite/test-cases.json \
            --compiler ilic=build/conformance-ilic/ilic \
            --baseline ilic=conformance/known-failures.json \
            --out build/conformance
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Upload conformance reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ilic-conformance
          path: build/conformance/
          if-no-files-found: warn
      - name: Enforce conformance result
        if: always()
        shell: bash
        run: exit "${{ steps.conformance.outputs.exit_code || '2' }}"
  native-debug-linux:
    name: Native Debug (Linux x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install --yes libcurl4-openssl-dev ninja-build
      - name: Configure native debug build
        run: >-
          cmake -S . -B build/debug -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DILIC_STATIC_DISTRIBUTION=OFF
      - name: Build native compiler and tests
        run: cmake --build build/debug --parallel
      - name: Run native debug tests
        run: ctest --test-dir build/debug --output-on-failure
  native-sanitizers-linux:
    name: Native ASan+UBSan (Linux x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Linux sanitizer dependencies
        run: sudo apt-get update && sudo apt-get install --yes clang libcurl4-openssl-dev ninja-build
      - name: Configure sanitizer build
        run: >-
          cmake -S . -B build/sanitizers -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          -DBUILD_TESTING=ON
          -DILIC_ENABLE_SANITIZERS=ON
          -DILIC_STATIC_DISTRIBUTION=OFF
      - name: Build native compiler and tests with sanitizers
        run: cmake --build build/sanitizers --parallel
      - name: Run native sanitizer tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          LSAN_OPTIONS: exitcode=23
        run: ctest --test-dir build/sanitizers --output-on-failure -j2
  native-thread-sanitizer-linux:
    name: Native TSan (Linux x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install --yes clang libcurl4-openssl-dev ninja-build
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Configure TSan build
        run: >-
          cmake -S . -B build/tsan -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          -DBUILD_TESTING=ON
          -DILIC_ENABLE_NATIVE_REPOSITORY=ON
          -DILIC_STATIC_DISTRIBUTION=OFF
          -DILIC_ENABLE_SANITIZERS=OFF
          -DILIC_ENABLE_THREAD_SANITIZER=ON
      - name: Build TSan compiler and tests
        run: cmake --build build/tsan --parallel
      - name: Run TSan tests
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: ctest --test-dir build/tsan --output-on-failure
      - name: Download pinned conformance suite
        shell: bash
        run: |
          set -euo pipefail
          suite_commit=88576ffc4cd491dd72d2375eb897ea9f3f55d2c3
          archive="$RUNNER_TEMP/interlis-conformance-suite.tar.gz"
          curl --fail --location --retry 3 \
            "https://codeberg.org/edigonzales/interlis-compiler-testsuite/archive/${suite_commit}.tar.gz" \
            --output "$archive"
          mkdir -p conformance-suite
          tar --extract --gzip --strip-components=1 --file="$archive" --directory=conformance-suite
      - name: Run full conformance suite under TSan
        id: conformance-tsan
        continue-on-error: true
        shell: bash
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: |
          set +e
          java conformance-suite/InterlisConformance.java run \
            --suite conformance-suite/suite/test-cases.json \
            --compiler ilic=build/tsan/ilic \
            --baseline ilic=conformance/known-failures.json \
            --out build/conformance-tsan
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Upload TSan conformance reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ilic-conformance-tsan
          path: build/conformance-tsan/
          if-no-files-found: warn
      - name: Enforce TSan conformance result
        if: always()
        shell: bash
        run: exit "${{ steps.conformance-tsan.outputs.exit_code || '2' }}"
  wasm-and-packages:
    name: WASM and JavaScript packages
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install pinned Emscripten SDK
        shell: bash
        run: |
          set -euo pipefail
          emscripten_version=$(tr -d '[:space:]' < .emscripten-version)
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$emscripten_version"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$emscripten_version"
      - name: Build WebAssembly package
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          ./scripts/build-wasm.sh
      - name: Test JavaScript packages
        run: |
          npm install --prefix packages/tools --no-save --package-lock=false ./packages/repository-core
          npm test --prefix packages/tools
          npm test --prefix packages/compiler-wasm
          node --test test/npm/PrepareNpmSnapshotTest.mjs
      - name: Verify snapshot package consumers
        run: |
          node scripts/prepare-npm-snapshot.mjs --timestamp 20260101000000
          node scripts/test-npm-packages.mjs

  diagnostic-catalog:
    name: P6 Diagnostic Catalog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Check catalog registration and diagnostic leaks
        run: node scripts/check-diagnostic-architecture.mjs .
      - name: Check native/WASM contract parity
        run: node scripts/check-diagnostic-contract-parity.mjs .

  diagnostic-quality:
    name: P6 Diagnostic Quality Report
    needs: diagnostic-catalog
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Configure diagnostics build
        run: >-
          cmake -S . -B build/diagnostics -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DILIC_ENABLE_NATIVE_REPOSITORY=OFF
          -DBUILD_TESTING=ON
      - name: Build diagnostics tests
        run: cmake --build build/diagnostics --parallel
      - name: Run diagnostics tests and report
        run: |
          ctest --test-dir build/diagnostics --output-on-failure -L 'diagnostics|wasm'
          node scripts/generate-diagnostic-quality-report.mjs . --output build/diagnostic-quality.json
      - name: Upload diagnostic quality report
        uses: actions/upload-artifact@v6
        with:
          name: ilic-diagnostic-quality-${{ github.sha }}
          path: build/diagnostic-quality.json
          if-no-files-found: error

  diagnostic-decision-lock:
    name: P6 Decision Lock
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject conformance baseline changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code origin/main...HEAD -- conformance/known-failures.json

  diagnostic-native-wasm-parity:
    name: P6 Native/WASM Diagnostics
    needs: diagnostic-catalog
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.14.0
      - name: Configure native ABI and diagnostic tests
        run: >-
          cmake -S . -B build/native-wasm-parity -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DILIC_ENABLE_NATIVE_REPOSITORY=OFF
          -DBUILD_TESTING=ON
      - name: Build native ABI and diagnostics
        run: cmake --build build/native-wasm-parity --parallel
      - name: Run native C-ABI and diagnostics tests
        run: ctest --test-dir build/native-wasm-parity --output-on-failure -R 'ilic_(capi|diagnostic)'
      - name: Run checked-in WASM package tests
        run: npm test --prefix packages/compiler-wasm
      - name: Check contract parity
        run: node scripts/check-diagnostic-contract-parity.mjs .

  diagnostic-language-tools:
    name: P6 Language Tools Diagnostics
    needs: diagnostic-catalog
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          repository: edigonzales/interlis-language-tools
          path: interlis-language-tools
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.14.0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: interlis-language-tools/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: interlis-language-tools
      - run: pnpm build:packages
        working-directory: interlis-language-tools
      - run: pnpm typecheck && pnpm lint && pnpm test
        working-directory: interlis-language-tools

  diagnostic-web-ide:
    name: P6 Web IDE Diagnostics
    needs: diagnostic-language-tools
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          repository: edigonzales/interlis-language-tools
          path: interlis-language-tools
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: edigonzales/interlis-web-ide
          path: interlis-web-ide
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.14.0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: |
            interlis-language-tools/pnpm-lock.yaml
            interlis-web-ide/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile && pnpm pack:verify
        working-directory: interlis-language-tools
      - run: pnpm install --no-frozen-lockfile --force --update-checksums
        working-directory: interlis-web-ide
      - run: pnpm typecheck && pnpm test && pnpm build
        working-directory: interlis-web-ide

  diagnostic-architecture-guards:
    name: P6 Architecture Guards
    needs: diagnostic-catalog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Run positive guards
        run: |
          node scripts/check-diagnostic-architecture.mjs .
          node scripts/generate-diagnostic-quality-report.mjs . --output diagnostic-quality.json
      - name: Run negative guard canary
        shell: bash
        run: |
          set +e
          node scripts/check-diagnostic-architecture.mjs . --canary
          status=$?
          test "$status" -ne 0
