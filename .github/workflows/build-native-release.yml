name: Build native release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-macos-arm64:
    runs-on: macos-14
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify ARM64 runner
        run: test "$(uname -m)" = "arm64"
      - name: Configure and build
        run: |
          cmake -S . -B build/release -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DILIC_STATIC_DISTRIBUTION=ON
          cmake --build build/release --parallel
          ctest --test-dir build/release --output-on-failure
      - name: Verify and smoke-test binary
        run: |
          scripts/check-macos-runtime-deps.sh build/release/ilic
          build/release/ilic -version
          build/release/ilic -silent docs/examples/models/Legacy.ili
          build/release/ilic -silent -repositories test/repository/fixture --no-default-repositories -models RepositoryRoot --ili-version 2.3
          build/release/ilic -silent -repositories test/repository/fixture --no-default-repositories test/repository/import-fallback/RepositoryConsumer.ili
      - name: Package
        run: tar -czf ilic-macos-arm64.tar.gz -C build/release ilic
      - uses: actions/upload-artifact@v6
        with:
          name: ilic-macos-arm64
          path: ilic-macos-arm64.tar.gz
          if-no-files-found: error

  build-linux-x86_64:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build and verify in pinned musl image
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          docker run --rm -v "$PWD:/src" -w /src alpine:3.20.3 sh -euxc '
            apk add --no-cache build-base cmake ninja perl linux-headers openssl-dev openssl-libs-static file binutils
            cmake -S . -B build/release-linux -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DILIC_STATIC_DISTRIBUTION=ON
            cmake --build build/release-linux --parallel
            ctest --test-dir build/release-linux --output-on-failure
            scripts/check-linux-static.sh build/release-linux/ilic
            build/release-linux/ilic -version
            build/release-linux/ilic -silent docs/examples/models/Legacy.ili
            build/release-linux/ilic -silent -repositories test/repository/fixture --no-default-repositories -models RepositoryRoot --ili-version 2.3
            build/release-linux/ilic -silent -repositories test/repository/fixture --no-default-repositories test/repository/import-fallback/RepositoryConsumer.ili
            tar -czf ilic-linux-x86_64.tar.gz -C build/release-linux ilic
          '
      - uses: actions/upload-artifact@v6
        with:
          name: ilic-linux-x86_64
          path: ilic-linux-x86_64.tar.gz
          if-no-files-found: error

  build-windows-x86_64:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify x86_64 runner
        shell: pwsh
        run: |
          if ([Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne "X64") {
            throw "x86_64 Windows is required"
          }
      - name: Configure, build and test
        run: |
          cmake -S . -B build/release -A x64 -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DILIC_STATIC_DISTRIBUTION=ON
          cmake --build build/release --config Release --parallel
          ctest --test-dir build/release -C Release --output-on-failure
      - name: Verify and smoke-test binary
        shell: pwsh
        run: |
          ./scripts/check-windows-runtime-deps.ps1 -Binary build/release/Release/ilic.exe
          build/release/Release/ilic.exe -version
          build/release/Release/ilic.exe -silent docs/examples/models/Legacy.ili
          build/release/Release/ilic.exe -silent -repositories test/repository/fixture --no-default-repositories -models RepositoryRoot --ili-version 2.3
          build/release/Release/ilic.exe -silent -repositories test/repository/fixture --no-default-repositories test/repository/import-fallback/RepositoryConsumer.ili
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path build/release/Release/ilic.exe -DestinationPath ilic-windows-x86_64.zip
      - uses: actions/upload-artifact@v6
        with:
          name: ilic-windows-x86_64
          path: ilic-windows-x86_64.zip
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    needs:
      - build-macos-arm64
      - build-linux-x86_64
      - build-windows-x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: native-release-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Download macOS archive
        uses: actions/download-artifact@v7
        with:
          name: ilic-macos-arm64
          path: dist
      - name: Download Linux archive
        uses: actions/download-artifact@v7
        with:
          name: ilic-linux-x86_64
          path: dist
      - name: Download Windows archive
        uses: actions/download-artifact@v7
        with:
          name: ilic-windows-x86_64
          path: dist
      - name: Create checksums
        shell: bash
        run: sha256sum dist/ilic-* > dist/SHA256SUMS
      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api_root="repos/$GITHUB_REPOSITORY"
          release_id=

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag=snapshot
            release_title="ilic snapshot"
            release_notes=$(printf 'Moving snapshot built from `%s` ([workflow run](%s/actions/runs/%s)).\n' \
              "$GITHUB_SHA" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")

            if gh api --silent "$api_root/git/ref/tags/$release_tag" >/dev/null 2>&1; then
              gh api --method PATCH "$api_root/git/refs/tags/$release_tag" \
                -f sha="$GITHUB_SHA" -F force=true >/dev/null
            else
              gh api --method POST "$api_root/git/refs" \
                -f ref="refs/tags/$release_tag" -f sha="$GITHUB_SHA" >/dev/null
            fi

            if release_id=$(gh api "$api_root/releases/tags/$release_tag" --jq .id 2>/dev/null); then
              gh api --method PATCH "$api_root/releases/$release_id" \
                -f name="$release_title" \
                -f body="$release_notes" \
                -F draft=false \
                -F prerelease=true \
                -f make_latest=false >/dev/null
            else
              release_id=$(gh api --method POST "$api_root/releases" \
                -f tag_name="$release_tag" \
                -f name="$release_title" \
                -f body="$release_notes" \
                -F draft=false \
                -F prerelease=true \
                -f make_latest=false \
                --jq .id)
            fi
          else
            release_tag="$GITHUB_REF_NAME"
            # Keep this job checkout-free: validate the pushed tag through the API.
            if ! gh api --silent "$api_root/git/ref/tags/$release_tag" >/dev/null 2>&1; then
              echo "The pushed tag $release_tag does not exist on GitHub; refusing to create a release." >&2
              exit 1
            fi
            if gh api --silent "$api_root/releases/tags/$release_tag" >/dev/null 2>&1; then
              echo "A release already exists for $release_tag; stable releases are immutable." >&2
              exit 1
            fi
            release_id=$(gh api --method POST "$api_root/releases" \
              -f tag_name="$release_tag" \
              -f name="ilic $release_tag" \
              -F draft=false \
              -F prerelease=false \
              -F generate_release_notes=true \
              -f make_latest=true \
              --jq .id)
          fi

          while IFS=$'\t' read -r existing_asset_id existing_asset_name; do
            [[ -n "$existing_asset_id" ]] || continue
            gh api --method DELETE "$api_root/releases/assets/$existing_asset_id" >/dev/null
          done < <(
            gh api --paginate "$api_root/releases/$release_id/assets?per_page=100" \
              --jq '.[] | [.id, .name] | @tsv'
          )

          for asset_path in dist/*; do
            asset_name=${asset_path##*/}
            curl --fail --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'Content-Type: application/octet-stream' \
              --data-binary "@$asset_path" \
              "https://uploads.github.com/$api_root/releases/$release_id/assets?name=$asset_name" \
              >/dev/null
          done
