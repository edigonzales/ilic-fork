name: Publish shared vcpkg registry version

on:
  repository_dispatch:
    types: [vcpkg-release-ready, vcpkg-port-publication-requested]
  workflow_dispatch:
    inputs:
      package_name:
        description: Port to publish
        required: true
        type: choice
        options: [ilic, iox-cpp]
      source_sha:
        description: Exact source commit
        required: true
        type: string
      version:
        description: X.Y.Z or X.Y.Z-snapshot.g<12 SHA>
        required: true
        type: string
      change_kind:
        description: New source or packaging-only revision
        required: true
        default: source
        type: choice
        options: [source, port]
      sha512:
        description: Optional expected GitHub source archive SHA512
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: shared-vcpkg-registry-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish immutable shared registry port
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VCPKG_DISABLE_METRICS: "1"
    steps:
      - name: Check out registry automation
        uses: actions/checkout@v6
        with:
          path: controller
          persist-credentials: false

      - name: Validate request
        id: request
        shell: bash
        env:
          EVENT_PACKAGE: ${{ github.event.client_payload.package_name }}
          EVENT_SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
          EVENT_VERSION: ${{ github.event.client_payload.version }}
          EVENT_CHANGE_KIND: ${{ github.event.client_payload.change_kind }}
          EVENT_SHA512: ${{ github.event.client_payload.sha512 }}
          EVENT_RELEASE_KIND: ${{ github.event.client_payload.release_kind }}
          EVENT_RELEASE_TAG: ${{ github.event.client_payload.release_tag }}
          INPUT_PACKAGE: ${{ inputs.package_name }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CHANGE_KIND: ${{ inputs.change_kind }}
          INPUT_SHA512: ${{ inputs.sha512 }}
        run: |
          set -euo pipefail
          package_name=${EVENT_PACKAGE:-${INPUT_PACKAGE:-ilic}}
          source_sha=${EVENT_SOURCE_SHA:-$INPUT_SOURCE_SHA}
          version=${EVENT_VERSION:-$INPUT_VERSION}
          change_kind=${EVENT_CHANGE_KIND:-${INPUT_CHANGE_KIND:-source}}
          expected_sha512=${EVENT_SHA512:-$INPUT_SHA512}
          case "$package_name" in
            ilic) source_repository=edigonzales/ilic-fork ;;
            iox-cpp) source_repository=edigonzales/iox-cpp ;;
            *) echo "Unsupported port: $package_name" >&2; exit 1 ;;
          esac
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid source SHA" >&2; exit 1; }
          [[ "$change_kind" == source || "$change_kind" == port ]] || { echo "Invalid change kind" >&2; exit 1; }
          [[ -z "$expected_sha512" || "$expected_sha512" =~ ^[0-9a-f]{128}$ ]] || { echo "Invalid SHA512" >&2; exit 1; }
          {
            echo "package_name=$package_name"
            echo "source_repository=$source_repository"
            echo "source_sha=$source_sha"
            echo "requested_version=$version"
            echo "change_kind=$change_kind"
            echo "expected_sha512=$expected_sha512"
            echo "release_kind=$EVENT_RELEASE_KIND"
            echo "release_tag=$EVENT_RELEASE_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Check out requested source
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.request.outputs.source_repository }}
          ref: ${{ steps.request.outputs.source_sha }}
          path: source
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Resolve and validate artifact version
        id: metadata
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.request.outputs.package_name }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          REQUESTED_VERSION: ${{ steps.request.outputs.requested_version }}
          RELEASE_KIND: ${{ steps.request.outputs.release_kind }}
          RELEASE_TAG: ${{ steps.request.outputs.release_tag }}
        run: |
          set -euo pipefail
          case "$PACKAGE_NAME" in
            ilic) base_version=$(sed -nE 's/.*project\(ilic VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' source/CMakeLists.txt) ;;
            iox-cpp) base_version=$(sed -nE 's/.*project\(iox-cpp VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' source/CMakeLists.txt) ;;
          esac
          [[ "$base_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid project base version" >&2; exit 1; }
          version=$REQUESTED_VERSION
          if [[ -z "$version" ]]; then
            if [[ "$RELEASE_KIND" == stable ]]; then
              version=${RELEASE_TAG#v}
            else
              version="${base_version}-snapshot.g${SOURCE_SHA:0:12}"
            fi
          fi
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            [[ "$version" == "$base_version" ]] || { echo "Stable version does not match project" >&2; exit 1; }
            expected_tag="v$version"
            tag_sha=$(git -C source rev-list -n 1 "$expected_tag" 2>/dev/null || true)
            [[ "$tag_sha" == "$SOURCE_SHA" ]] || { echo "$expected_tag does not resolve to $SOURCE_SHA" >&2; exit 1; }
          elif [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-snapshot\.g[0-9a-f]{12}$ ]]; then
            [[ "$version" == "${base_version}-snapshot.g${SOURCE_SHA:0:12}" ]] || { echo "Snapshot version does not match source" >&2; exit 1; }
          else
            echo "New versions must use X.Y.Z or X.Y.Z-snapshot.g<12 SHA>" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Compute and verify source archive SHA512
        id: archive
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ steps.request.outputs.source_repository }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          EXPECTED_SHA512: ${{ steps.request.outputs.expected_sha512 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/source-$SOURCE_SHA.tar.gz"
          curl --fail --location --retry 3 \
            "https://github.com/$SOURCE_REPOSITORY/archive/$SOURCE_SHA.tar.gz" \
            --output "$archive"
          sha512=$(sha512sum "$archive" | awk '{print $1}')
          [[ "$sha512" =~ ^[0-9a-f]{128}$ ]] || exit 1
          [[ -z "$EXPECTED_SHA512" || "$sha512" == "$EXPECTED_SHA512" ]] || { echo "Archive SHA512 mismatch" >&2; exit 1; }
          echo "sha512=$sha512" >> "$GITHUB_OUTPUT"

      - name: Check out shared registry
        uses: actions/checkout@v6
        with:
          ref: vcpkg-registry
          path: registry
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Check out pinned vcpkg
        uses: actions/checkout@v6
        with:
          repository: microsoft/vcpkg
          ref: 2026.05.25
          path: build/vcpkg-version-tool
          persist-credentials: false

      - name: Bootstrap vcpkg
        run: build/vcpkg-version-tool/bootstrap-vcpkg.sh -disableMetrics

      - name: Publish registry entry
        id: registry
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.request.outputs.package_name }}
          VERSION: ${{ steps.metadata.outputs.version }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          SOURCE_SHA512: ${{ steps.archive.outputs.sha512 }}
          CHANGE_KIND: ${{ steps.request.outputs.change_kind }}
        run: |
          set -euo pipefail
          version_file="registry/versions/i-/$PACKAGE_NAME.json"
          if [[ "$CHANGE_KIND" == port ]]; then
            current=$(jq -r --arg version "$VERSION" '[.versions[] | select(."version-string" == $version) | (."port-version" // 0)] | max // empty' "$version_file")
            [[ -n "$current" ]] || { echo "Cannot revise missing $PACKAGE_NAME $VERSION" >&2; exit 1; }
            port_version=$((current + 1))
          else
            port_version=0
          fi
          mapfile -t existing_trees < <(jq -r --arg version "$VERSION" --argjson port "$port_version" \
            '.versions[] | select(."version-string" == $version and (."port-version" // 0) == $port) | ."git-tree"' "$version_file")
          (( ${#existing_trees[@]} <= 1 )) || { echo "Duplicate registry entries" >&2; exit 1; }
          if (( ${#existing_trees[@]} == 1 )); then
            tree=${existing_trees[0]}
            git -C registry show "$tree:vcpkg.json" > "$RUNNER_TEMP/existing-vcpkg.json"
            git -C registry show "$tree:portfile.cmake" > "$RUNNER_TEMP/existing-portfile.cmake"
            jq -e --arg name "$PACKAGE_NAME" --arg version "$VERSION" --argjson port "$port_version" \
              '.name == $name and ."version-string" == $version and (."port-version" // 0) == $port' "$RUNNER_TEMP/existing-vcpkg.json" >/dev/null
            grep -Fq "REF $SOURCE_SHA" "$RUNNER_TEMP/existing-portfile.cmake"
            grep -Fq "SHA512 $SOURCE_SHA512" "$RUNNER_TEMP/existing-portfile.cmake"
            echo "$PACKAGE_NAME $VERSION#$port_version already exists immutably"
          else
            node controller/scripts/prepare-vcpkg-registry-port.mjs \
              --template-dir "source/vcpkg/ports/$PACKAGE_NAME" \
              --output-dir "registry/ports/$PACKAGE_NAME" \
              --package-name "$PACKAGE_NAME" \
              --version "$VERSION" --port-version "$port_version" \
              --source-sha "$SOURCE_SHA" --sha512 "$SOURCE_SHA512"
            cp controller/vcpkg/registry-README.md registry/README.md
            git -C registry add "ports/$PACKAGE_NAME" README.md
            (cd registry && "$GITHUB_WORKSPACE/build/vcpkg-version-tool/vcpkg" x-add-version \
              --x-builtin-ports-root="$PWD/ports" \
              --x-builtin-registry-versions-dir="$PWD/versions" \
              "$PACKAGE_NAME" --skip-version-format-check --verbose)
            git -C registry add versions
            test "$(jq -r --arg name "$PACKAGE_NAME" '.default[$name].baseline' registry/versions/baseline.json)" = "$VERSION"
            test "$(jq -r --arg name "$PACKAGE_NAME" '.default[$name]."port-version" // 0' registry/versions/baseline.json)" = "$port_version"
            git -C registry config user.name "github-actions[bot]"
            git -C registry config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C registry commit -m "publish $PACKAGE_NAME $VERSION#$port_version"
            git -C registry push origin HEAD:vcpkg-registry
          fi
          echo "baseline=$(git -C registry rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Request ilic binary-cache publication
        if: steps.request.outputs.package_name == 'ilic'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.metadata.outputs.version }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          REGISTRY_BASELINE: ${{ steps.registry.outputs.baseline }}
        shell: bash
        run: |
          jq -n --arg version "$VERSION" --arg source_sha "$SOURCE_SHA" --arg registry_baseline "$REGISTRY_BASELINE" \
            '{event_type:"vcpkg-version-published",client_payload:{version:$version,source_sha:$source_sha,registry_baseline:$registry_baseline}}' |
            gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" --input -
