name: vcpkg Automation Quality

on:
  pull_request:
    paths:
      - "scripts/prepare-vcpkg-registry-port.mjs"
      - "test/release/PrepareVcpkgRegistryPortTest.mjs"
      - "vcpkg/**"
      - ".github/workflows/vcpkg-*.yml"
      - ".github/workflows/release-native.yml"
  push:
    branches: [main]
    paths:
      - "scripts/prepare-vcpkg-registry-port.mjs"
      - "test/release/PrepareVcpkgRegistryPortTest.mjs"
      - "vcpkg/**"
      - ".github/workflows/vcpkg-*.yml"
      - ".github/workflows/release-native.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  automation:
    name: Registry automation tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VCPKG_DISABLE_METRICS: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Test release and vcpkg version helpers
        run: |
          python3 -m unittest test/release_metadata_test.py
          node --test \
            test/release/CheckReleaseVersionTest.mjs \
            test/release/PrepareVcpkgRegistryPortTest.mjs
      - name: Validate release dispatch contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'event_type "vcpkg-release-ready"' .github/workflows/release-native.yml
          grep -Fq 'always() && needs.publish-release.result' .github/workflows/release-native.yml
          grep -Fq 'types: [vcpkg-release-ready, vcpkg-port-publication-requested]' .github/workflows/vcpkg-version-publish.yml
          grep -Fq 'group: shared-vcpkg-registry-publish' .github/workflows/vcpkg-version-publish.yml
          grep -Fq 'Request ilic binary-cache publication' .github/workflows/vcpkg-version-publish.yml
          grep -Fq 'types: [vcpkg-version-published]' .github/workflows/vcpkg-binary-cache.yml
      - name: Render the real ilic port with synthetic immutable metadata
        shell: bash
        run: |
          set -euo pipefail
          source_sha=0123456789abcdef0123456789abcdef01234567
          sha512=$(printf 'a%.0s' {1..128})
          node scripts/prepare-vcpkg-registry-port.mjs \
            --template-dir vcpkg/ports/ilic \
            --output-dir build/vcpkg-render-smoke/ilic \
            --version 0.10.0-snapshot.g0123456789ab \
            --source-sha "$source_sha" \
            --sha512 "$sha512"
          grep -Fq "REF $source_sha" build/vcpkg-render-smoke/ilic/portfile.cmake
          grep -Fq "SHA512 $sha512" build/vcpkg-render-smoke/ilic/portfile.cmake
          node -e 'const p=require("./build/vcpkg-render-smoke/ilic/vcpkg.json"); if (p["version-string"] !== "0.10.0-snapshot.g0123456789ab") process.exit(1)'

      - name: Check out registry for local smoke test
        uses: actions/checkout@v6
        with:
          ref: vcpkg-registry
          path: build/registry-smoke
          fetch-depth: 0
          persist-credentials: false

      - name: Check out pinned vcpkg for registry smoke test
        uses: actions/checkout@v6
        with:
          repository: microsoft/vcpkg
          ref: 2026.05.25
          path: build/vcpkg-version-smoke
          persist-credentials: false

      - name: Bootstrap pinned vcpkg
        shell: bash
        run: build/vcpkg-version-smoke/bootstrap-vcpkg.sh -disableMetrics

      - name: Run x-add-version against local registry copy
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$GITHUB_SHA"
          base_version=$(sed -nE 's/.*project\(ilic VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)
          version="${base_version}-snapshot.g${source_sha:0:12}"
          sha512=$(printf 'a%.0s' {1..128})

          node scripts/prepare-vcpkg-registry-port.mjs \
            --template-dir vcpkg/ports/ilic \
            --output-dir build/registry-smoke/ports/ilic \
            --version "$version" \
            --source-sha "$source_sha" \
            --sha512 "$sha512"
          git -C build/registry-smoke add ports/ilic

          (
            cd build/registry-smoke
            "$GITHUB_WORKSPACE/build/vcpkg-version-smoke/vcpkg" x-add-version \
              --x-builtin-ports-root="$PWD/ports" \
              --x-builtin-registry-versions-dir="$PWD/versions" \
              ilic \
              --skip-version-format-check \
              --verbose
          )

          test "$(jq -r '.default.ilic.baseline' build/registry-smoke/versions/baseline.json)" = "$version"
          jq -e --arg version "$version" \
            '.versions[] | select(."version-string" == $version and (."port-version" // 0) == 0 and ."git-tree" != null)' \
            build/registry-smoke/versions/i-/ilic.json >/dev/null
