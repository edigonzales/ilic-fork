name: Publish ilic npm packages

on:
  workflow_dispatch:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: publish-ilic-npm
  cancel-in-progress: false

jobs:
  snapshot:
    name: Publish coordinated snapshot
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: npm install --global npm@11.18.0
      - name: Resolve deterministic identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 scripts/release_metadata.py version --source-sha "$GITHUB_SHA")
          published_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          python3 scripts/release_metadata.py manifest \
            --artifact-version "$version" \
            --source-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --published-at "$published_at" \
            --toolchain "emscripten-$(tr -d '[:space:]' < .emscripten-version)" \
            --output build/release/interlis-release.json
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install pinned Emscripten SDK
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < .emscripten-version)
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$version"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$version"
      - name: Build and test source packages
        env:
          ILIC_WASM_VERSION: ${{ steps.release.outputs.version }}
          ILIC_EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          ./scripts/build-wasm.sh
          npm install --prefix packages/tools --no-save --package-lock=false ./packages/repository-core
          npm install --prefix packages/compiler-wasm --no-save --package-lock=false ./packages/repository-core ./packages/tools
          npm test --prefix packages/repository-core
          npm test --prefix packages/tools
          npm test --prefix packages/compiler-wasm
          python3 -m unittest test/release_metadata_test.py
          node --test test/npm/PrepareNpmSnapshotTest.mjs
      - name: Stage and verify immutable packages
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-npm-snapshot.mjs \
            --source-sha "$GITHUB_SHA" \
            --release-manifest build/release/interlis-release.json \
            --github-output "$GITHUB_OUTPUT"
          node scripts/test-npm-packages.mjs \
            --expected-version "${{ steps.release.outputs.version }}" \
            --version-kind snapshot
      - name: Publish missing packages under snapshot tag
        env:
          NPM_CONFIG_PROVENANCE: true
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          publish_snapshot() {
            local package_name=$1
            local directory=$2
            if npm view "$package_name@$VERSION" version >/dev/null 2>&1; then
              test "$(npm view "$package_name@$VERSION" gitHead)" = "$GITHUB_SHA"
              echo "$package_name@$VERSION already exists from this commit"
            else
              npm publish "$directory" --access public --tag snapshot
            fi
          }
          publish_snapshot @ilic/repository-core "${{ steps.stage.outputs.repository_core_directory }}"
          publish_snapshot @ilic/tools "${{ steps.stage.outputs.tools_directory }}"
          publish_snapshot @ilic/compiler-wasm "${{ steps.stage.outputs.compiler_wasm_directory }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ilic-snapshot-provenance
          path: build/release/interlis-release.json
          if-no-files-found: error

  stable:
    name: Publish immutable stable release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: npm install --global npm@11.18.0
      - name: Validate tag and create provenance
        id: release
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          version=$(python3 scripts/release_metadata.py version \
            --kind stable --tag "$GITHUB_REF_NAME" --source-sha "$GITHUB_SHA")
          published_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          python3 scripts/release_metadata.py manifest \
            --artifact-version "$version" --source-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --published-at "$published_at" \
            --toolchain "emscripten-$(tr -d '[:space:]' < .emscripten-version)" \
            --output build/release/interlis-release.json
          echo "version=$version" >> "$GITHUB_OUTPUT"
          for package in @ilic/repository-core @ilic/tools @ilic/compiler-wasm; do
            if npm view "$package@$version" version >/dev/null 2>&1; then
              echo "$package@$version already exists; stable releases are immutable" >&2
              exit 1
            fi
          done
      - name: Install pinned Emscripten SDK
        shell: bash
        run: |
          version=$(tr -d '[:space:]' < .emscripten-version)
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$version"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$version"
      - name: Build, stage and verify stable packages
        id: stage
        env:
          ILIC_WASM_VERSION: ${{ steps.release.outputs.version }}
          ILIC_EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          ./scripts/build-wasm.sh
          node scripts/prepare-npm-release.mjs \
            --expected-version "${{ steps.release.outputs.version }}" \
            --expected-tag "$GITHUB_REF_NAME" \
            --source-sha "$GITHUB_SHA" \
            --release-manifest build/release/interlis-release.json \
            --github-output "$GITHUB_OUTPUT"
          node scripts/test-npm-packages.mjs \
            --staging-root build/npm-release \
            --expected-version "${{ steps.release.outputs.version }}" \
            --version-kind stable
      - name: Publish stable packages under latest tag
        env:
          NPM_CONFIG_PROVENANCE: true
        run: |
          npm publish "${{ steps.stage.outputs.repository_core_directory }}" --access public --tag latest
          npm publish "${{ steps.stage.outputs.tools_directory }}" --access public --tag latest
          npm publish "${{ steps.stage.outputs.compiler_wasm_directory }}" --access public --tag latest
      - uses: actions/upload-artifact@v7
        with:
          name: ilic-stable-provenance
          path: build/release/interlis-release.json
          if-no-files-found: error
