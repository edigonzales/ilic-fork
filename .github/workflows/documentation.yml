name: Documentation Quality

on:
  push:
    branches: [main]
    paths:
      - "*"
      - "**/*.md"
      - "docs/**"
      - "test/docs/**"
      - "scripts/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "*"
      - "**/*.md"
      - "docs/**"
      - "test/docs/**"
      - "scripts/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    name: Documentation Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Validate documentation and repository documentation conventions
        run: node test/docs/DocumentationTest.mjs .
